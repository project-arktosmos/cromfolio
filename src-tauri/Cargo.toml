[package]
name = "cromfolio-app"
version = "0.1.0"
description = "Cromfolio - Arktosmos Application"
authors = ["Arktosmos"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "cromfolio-app"

[lib]
name = "cromfolio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
urlencoding = "2.1"
url = "2.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2.0"
futures = "0.3"
dotenvy = "0.15"
librqbit = "8.1"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"

# EVM
revm = { version = "19", default-features = false, features = ["std", "serde"] }
alloy-primitives = { version = "0.8", features = ["serde", "rlp"] }
alloy-sol-types = "0.8"
alloy-rlp = "0.3"
k256 = { version = "0.13", features = ["ecdsa", "schnorr"] }
rand = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 16
opt-level = 2
lto = false
incremental = true
