[package]
name = "synaxis-app"
version = "0.1.0"
description = "Synaxis - Arktosmos Application"
authors = ["Arktosmos"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "synaxis-app"

[lib]
name = "synaxis_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["blocking"] }
url = "2.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 16
opt-level = 2
lto = false
incremental = true
